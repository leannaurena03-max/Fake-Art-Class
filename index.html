<head>

<title>A.I. FOR DESIGNERS — Leanna Urena</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3ea;--card:rgba(255,251,245,.92);--text:#5f5046;--line:#d8cabf;}
*{box-sizing:border-box}
body{
margin:0;padding:24px;font-family:'Fredoka',sans-serif;color:var(--text);
background-color:var(--bg);
background-image:
radial-gradient(circle at 25px 25px, rgba(255,255,255,.45) 2px, transparent 2px),
radial-gradient(circle at 0 0, rgba(214,196,183,.22) 1px, transparent 1px),
repeating-radial-gradient(circle at center, transparent 0 28px, rgba(214,196,183,.09) 29px 30px);
background-size:80px 80px,40px 40px,220px 220px;
}
.container{
max-width:900px;margin:auto;padding:36px;border-radius:28px;
background:var(--card);backdrop-filter:blur(4px);
box-shadow:0 8px 28px rgba(0,0,0,.06);
border:1px solid rgba(255,255,255,.7);
}
h1{
margin:0;font-size:clamp(2.2rem,6vw,4.6rem);
font-weight:600;
text-shadow:0 2px 0 rgba(255,255,255,.9),0 8px 18px rgba(255,255,255,.7);
}
.subtitle,.email{font-size:1.15rem;margin-top:.4rem}
a{color:inherit}
h2{margin-top:2.2rem}
ol{list-style:none;padding:0}
li a{
display:flex;gap:18px;align-items:center;
margin:.8rem 0;padding:16px 18px;text-decoration:none;
border:1px solid var(--line);border-radius:18px;
background:rgba(255,255,255,.55);
transition:.2s;
}
li a:hover{transform:translateY(-2px);background:white}
.num{font-weight:600;width:42px}
@media(max-width:600px){.container{padding:24px}}
</style>
</head>
